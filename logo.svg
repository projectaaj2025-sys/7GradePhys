<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="t d">
  <title id="t">Физика-Квест: Энергетический Щит</title>
  <desc id="d">Эмблема: ракета внутри защитного щита, вокруг — орбита атома и астероиды.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3f2fd"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fce4ec"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00b8d4"/>
      <stop offset="1" stop-color="#1976d2"/>
    </linearGradient>
    <linearGradient id="rocket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b3e5fc"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a00"/>
      <stop offset="1" stop-color="#d81b60"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="34" fill="url(#sky)"/>

  <!-- щит -->
  <path d="M120 26 44 56v60c0 44 32 74 76 98 44-24 76-54 76-98V56z"
        fill="#ffffff" stroke="url(#shield)" stroke-width="7" stroke-linejoin="round"/>
  <path d="M120 44 60 68v48c0 34 24 58 60 78 36-20 60-44 60-78V68z"
        fill="none" stroke="rgba(0,184,212,.35)" stroke-width="3" stroke-dasharray="7 9"/>

  <!-- орбита атома -->
  <g transform="translate(120 116)" fill="none" stroke="#d81b60" stroke-width="3.5" opacity=".8">
    <ellipse rx="52" ry="19"/>
    <ellipse rx="52" ry="19" transform="rotate(60)"/>
    <ellipse rx="52" ry="19" transform="rotate(120)"/>
  </g>
  <circle cx="120" cy="116" r="7" fill="#d81b60"/>

  <!-- ракета -->
  <g transform="translate(120 118)">
    <path d="M0-56c14 16 20 34 20 52 0 14-4 26-8 34h-24c-4-8-8-20-8-34 0-18 6-36 20-52z"
          fill="url(#rocket)" stroke="#008ba3" stroke-width="4" stroke-linejoin="round"/>
    <circle cy="-18" r="9" fill="#e1f5fe" stroke="#00b8d4" stroke-width="4"/>
    <path d="M-20 6-38 30l6-26zM20 6 38 30l-6-26z" fill="#00b8d4"/>
    <path d="M-9 30c2 12 5 20 9 26 4-6 7-14 9-26z" fill="url(#flame)"/>
  </g>

  <!-- астероиды -->
  <g fill="#5a6b85">
    <circle cx="46" cy="196" r="7"/><circle cx="196" cy="190" r="9"/><circle cx="176" cy="42" r="6"/>
  </g>
  <g stroke="#5a6b85" stroke-width="2.5" stroke-linecap="round" opacity=".7">
    <path d="M56 186 74 170M182 200 166 214M170 52 154 66"/>
  </g>

  <!-- подпись-строка -->
  <text x="120" y="222" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif"
        font-size="17" font-weight="700" fill="#1a2942" letter-spacing="1">ФИЗИКА-КВЕСТ</text>
</svg>
